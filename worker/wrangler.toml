# 作品集语音讲解员的后端：只做一件事——替网页保管 DeepSeek 密钥、转发流式回答、限流。
# 部署：见 worker/README.md。密钥不写在这里，用 `wrangler secret put DEEPSEEK_API_KEY` 或 GitHub Actions 注入。
name = "embodied-lab-guide"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
